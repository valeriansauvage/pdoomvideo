<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemple d'intégration · vidéo « La chaux, le souffle du vieux bâti »</title>
<style>
  /* Styles de démonstration seulement : sur le vrai site, la section prend la charte du site. */
  body { margin: 0; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; color: #2F2A2E; background: #fff; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
  h2 { font: 600 clamp(26px, 4vw, 38px)/1.2 Georgia, serif; margin: 0 0 8px; }
  .chapeau { margin: 0 0 20px; color: #6B6259; }
</style>
</head>
<body>
<main>
  <!-- ===== À copier dans la page du site : la section et son script ===== -->
  <section class="video-chaux" aria-label="Vidéo : la chaux et le vieux bâti">
    <h2>Comprendre en 1 minute</h2>
    <p class="chapeau">Pourquoi un vieux mur doit respirer, et pourquoi la chaux le protège mieux que le ciment.</p>
    <iframe id="video-chaux" src="video-chaux/index.html"
            title="Vidéo interactive : la chaux, le souffle du vieux bâti"
            style="width:100%;height:760px;border:0;display:block"
            allow="fullscreen" loading="lazy"></iframe>
  </section>
  <script>
    // Le lecteur envoie sa hauteur : on ajuste l'iframe (utile sur mobile et quand le texte est déplié).
    addEventListener('message', e => {
      if (e.data && e.data.videoChauxHauteur) document.getElementById('video-chaux').style.height = e.data.videoChauxHauteur + 'px';
    });
  </script>
  <!-- ===== fin du bloc à copier ===== -->
</main>
</body>
</html>
