<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La chaux, le souffle du vieux bâti · vidéo interactive</title>
<meta name="description" content="Une minute pour comprendre pourquoi les murs anciens doivent respirer, et pourquoi un enduit à la chaux les protège mieux que le ciment.">
<meta property="og:title" content="La chaux, le souffle du vieux bâti">
<meta property="og:description" content="Vidéo interactive d'une minute : le vieux bâti, l'humidité, le piège du ciment et les bienfaits de la chaux.">
<meta property="og:image" content="media/affiche.jpg">
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="lecteur.css">
</head>
<body>
<main class="vc">
  <figure class="vc-player" id="vc-lecteur" aria-label="Vidéo interactive : la chaux, le souffle du vieux bâti">
    <div class="vc-stage" id="vc-stage">
      <video id="vc-video" preload="none" playsinline poster="media/affiche.jpg" aria-describedby="vc-texte"></video>

      <button class="vc-start" id="vc-start" type="button" aria-label="Lancer la vidéo (1 minute)">
        <span class="vc-play-big" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></span>
        <span class="vc-start-sous">Vidéo interactive · 1 minute · avec le son</span>
      </button>

      <div id="vc-hotspots"></div>

      <div class="vc-layer" id="vc-fiche" hidden role="dialog" aria-modal="true" aria-labelledby="vc-fiche-titre">
        <div class="vc-box">
          <p class="vc-kicker">En savoir plus</p>
          <h2 id="vc-fiche-titre"></h2>
          <p id="vc-fiche-texte"></p>
          <div class="vc-btns"><button class="vc-btn" id="vc-fiche-ok" type="button">Reprendre la vidéo ▶</button></div>
        </div>
      </div>

      <div class="vc-layer" id="vc-quiz" hidden role="dialog" aria-modal="true" aria-labelledby="vc-quiz-q">
        <div class="vc-box">
          <p class="vc-kicker">À vous de choisir</p>
          <h2 id="vc-quiz-q"></h2>
          <div class="vc-choix" id="vc-quiz-choix"></div>
          <p class="vc-retour" id="vc-quiz-retour" aria-live="polite"></p>
        </div>
      </div>

      <div class="vc-end" id="vc-end" hidden></div>
    </div>

    <div class="vc-controls">
      <button class="vc-ic" id="vc-play" type="button" aria-label="Lecture">
        <svg viewBox="0 0 24 24" class="i-play"><path d="M7 4.5l13 7.5-13 7.5z"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <div class="vc-bar" id="vc-bar" role="slider" tabindex="0" aria-label="Position dans la vidéo" aria-valuemin="0" aria-valuemax="60" aria-valuenow="0"></div>
      <span class="vc-time" id="vc-time">0:00 / 1:00</span>
      <button class="vc-ic" id="vc-son" type="button" aria-label="Couper le son">
        <svg viewBox="0 0 24 24" class="i-on"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>
        <svg viewBox="0 0 24 24" class="i-off" hidden><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="vc-ic" id="vc-plein" type="button" aria-label="Plein écran">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="vc-chapters" id="vc-chapitres" aria-label="Chapitres"></nav>
  </figure>

  <details class="vc-transcript" id="vc-texte">
    <summary>Lire le texte de la vidéo</summary>
    <div id="vc-texte-corps"></div>
  </details>
</main>
<script src="cues.js"></script>
<script src="lecteur.js"></script>
</body>
</html>
