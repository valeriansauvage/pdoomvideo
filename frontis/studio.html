<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FRONTIS · plans d'ouverture et de fin</title>
<style>
  @font-face { font-family: 'Barlow Condensed'; src: url('assets/fonts/BarlowCondensed-SemiBold.ttf'); font-weight: 600; font-display: block; }
  html, body { margin: 0; background: #1d1f1e; color: #eee; font: 14px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 10px; }
  #out { width: min(100%, 1280px); height: auto; background: repeating-conic-gradient(#bbb 0 25%, #ddd 0 50%) 0 0 / 24px 24px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; min-width: 200px; }
  #tt { font-variant-numeric: tabular-nums; min-width: 60px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar">
    <select id="plan"><option value="intro">Ouverture</option><option value="fin">Fin</option></select>
    <select id="mode"><option value="plein">Fond plein</option><option value="alpha">Fond transparent</option></select>
    <button id="lire" type="button">Lecture</button>
    <input id="scrub" type="range" min="0" max="5" step="0.04" value="0"><span id="tt"></span>
  </div>
</main>
<script src="src/logo.js"></script>
<script src="src/carton.js"></script>
</body>
</html>
